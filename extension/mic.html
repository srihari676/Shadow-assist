<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shadow UI — Microphone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
      color: #fff;
      gap: 16px;
    }
    .pulse {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    .pulse.error { background: #cc0033; animation: none; }
    .pulse.done { background: #2a9d4a; animation: none; }
    #status { font-size: 16px; text-align: center; padding: 0 20px; }
    #transcript { font-size: 18px; font-weight: 600; text-align: center; padding: 0 20px; min-height: 24px; }
  </style>
</head>
<body>
  <div class="pulse" id="indicator">&#127908;</div>
  <div id="status">Listening...</div>
  <div id="transcript"></div>
  <script src="mic.js"></script>
</body>
</html>
