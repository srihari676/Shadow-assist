<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SignCaption — Camera Permission</title>
<style>
  body {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #f8fafc;
    color: #0f172a;
  }
  h1 { font-size: 20px; font-weight: 800; color: #1e1b4b; }
  p { font-size: 13px; color: #475569; line-height: 1.5; }
  button {
    padding: 10px 18px;
    background: #4f46e5;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    margin-top: 12px;
  }
  video {
    width: 100%;
    margin-top: 16px;
    border-radius: 16px;
    border: 2px solid #e2e8f0;
    background: #0f172a;
  }
  .result { font-family: monospace; font-size: 13px; margin-top: 14px; font-weight: 700; }
  .result.ok { color: #16a34a; }
  .result.err { color: #dc2626; }
</style>
  <script type="module" crossorigin src="/assets/permission-D_eGt6nd.js"></script>
</head>
<body>
  <h1>Grant camera access</h1>
  <p>
    Click the button below. Chrome should show a permission prompt near the address bar —
    allow it. Once you see your video below, close this tab and go back to the SignCaption
    side panel, then click <strong>Start camera</strong> again.
  </p>
  <button id="grantBtn">Request camera access</button>
  <div id="result" class="result"></div>
  <video id="preview" autoplay playsinline muted></video>

</body>
</html>
